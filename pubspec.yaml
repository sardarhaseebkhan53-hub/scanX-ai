name: scanx_ai
description: "ScanX AI - The World's Best AI-Powered Document Scanner with Enterprise Security, ML Kit OCR, and Pluggable AI Engine (Gemini / OpenAI)."
version: 1.0.0+1
publish_to: "none"

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Architecture
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  get_it: ^7.7.0
  equatable: ^2.0.5

  # Storage & Persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3

  # Networking & AI Pluggable Clients
  dio: ^5.4.3
  http: ^1.2.1

  # Firebase Enterprise Stack
  firebase_core: ^2.31.0
  firebase_auth: ^4.19.4
  cloud_firestore: ^4.17.2
  firebase_storage: ^11.7.4
  firebase_messaging: ^14.9.1
  firebase_analytics: ^10.10.4
  firebase_crashlytics: ^3.4.19
  firebase_remote_config: ^4.4.4

  # Google Play & Monetization
  google_mobile_ads: ^5.1.0
  in_app_purchase: ^3.1.13

  # Scanner, Camera, Image & OCR
  camera: ^0.11.0+1
  image_picker: ^1.1.1
  google_mlkit_text_recognition: ^0.13.0
  image: ^4.2.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1

  # PDF Engine & Generation
  pdf: ^3.11.0
  printing: ^5.13.1

  # Enterprise Security & Biometrics
  local_auth: ^2.2.0
  crypto: ^3.0.3

  # UI, Animations & Utilities
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  file_picker: ^8.0.3
  share_plus: ^9.0.0
  permission_handler: ^11.3.1
  cached_network_image: ^3.3.1
  intl: ">=0.19.0 <1.0.0"
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.9

dependency_overrides:
  intl: any
  meta: any
  collection: any
  path: any

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/i18n/
    - assets/mock/
